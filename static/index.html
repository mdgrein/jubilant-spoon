<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clowder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a1a1a;
      --sidebar:  #111;
      --border:   #333;
      --accent:   #5af;
      --muted:    #666;
      --text:     #ddd;
      --head:     #888;
      --run:      #fa0;
      --ok:       #4c4;
      --fail:     #e44;
      --pending:  #888;
      --retry:    #f80;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Consolas', 'Menlo', 'Courier New', monospace; font-size: 13px; }

    #app { display: flex; height: 100vh; overflow: hidden; }

    /* ── sidebar ─────────────────────────────────────────── */
    #sidebar { width: 260px; min-width: 200px; background: var(--sidebar);
      border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

    #sidebar-title { padding: 14px 16px 10px; font-size: 16px; font-weight: bold;
      letter-spacing: 2px; color: var(--accent); border-bottom: 1px solid var(--border); flex-shrink: 0; }

    #sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 0; }

    .section-header { padding: 6px 16px 4px; color: var(--head); font-size: 11px;
      text-transform: uppercase; letter-spacing: 1px; cursor: pointer; user-select: none; }
    .section-header:hover { color: var(--text); }

    /* indent levels: pipeline=24px, stage=36px, job=48px */
    .sb-pipeline { padding: 4px 16px 4px 24px; cursor: pointer; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent; }
    .sb-stage    { padding: 3px 16px 3px 36px; cursor: pointer; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent;
      font-size: 12px; }
    .sb-job      { padding: 3px 16px 3px 48px; cursor: pointer; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent;
      font-size: 12px; }
    .sb-iteration { padding: 2px 16px 2px 60px; cursor: pointer; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent;
      font-size: 11px; opacity: 0.8; }
    .sb-template { padding: 4px 16px 4px 24px; cursor: pointer; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent; }

    .sb-chain-header { padding: 3px 16px 3px 48px; color: var(--muted); font-weight: bold;
      font-size: 0.85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sb-pipeline:hover, .sb-stage:hover, .sb-job:hover, .sb-template:hover { background: #222; }

    .sb-active { background: #1e2d3d !important; border-left-color: var(--accent) !important;
      color: var(--accent) !important; }

    /* ── right pane ──────────────────────────────────────── */
    #right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #detail-panel { flex: 0 0 auto; min-height: 140px; max-height: 45%;
      border-bottom: 1px solid var(--border); padding: 16px 20px; overflow-y: auto; }

    #detail-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: var(--accent); }

    .detail-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .detail-label { color: var(--muted); min-width: 90px; }
    .detail-value { color: var(--text); word-break: break-all; }

    .status-running   { color: var(--run); }
    .status-waiting   { color: #a08020; }
    .status-completed { color: var(--ok); }
    .status-failed    { color: var(--fail); }
    .status-pending   { color: var(--pending); }
    .status-retrying  { color: var(--retry); }
    .status-skipped   { color: var(--muted); }

    #detail-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

    button { background: #2a2a2a; color: var(--text); border: 1px solid var(--border);
      padding: 5px 14px; cursor: pointer; font-family: inherit; font-size: 12px; border-radius: 3px; }
    button:hover { background: #333; border-color: var(--accent); color: var(--accent); }
    button.danger:hover { border-color: var(--fail); color: var(--fail); }
    button.primary { border-color: var(--accent); color: var(--accent); }

    .copy-btn { background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 11px; padding: 0 4px; opacity: 0.5; vertical-align: middle; border-radius: 2px; }
    .copy-btn:hover { color: var(--accent); opacity: 1; background: none; border: none; }
    .copy-btn.copied { color: var(--ok); opacity: 1; }

    /* ── log panel ───────────────────────────────────────── */
    #log-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #log-header { padding: 6px 20px; border-bottom: 1px solid var(--border); color: var(--head);
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #log-status { font-size: 11px; color: var(--run); }
    #log-output { flex: 1; overflow-y: auto; padding: 12px 20px; white-space: pre-wrap;
      word-break: break-word; line-height: 1.5; color: #bbb; font-size: 12px; }
    #log-output .log-line { display: block; }

    /* ── start dialog ────────────────────────────────────── */
    dialog { background: #1e1e1e; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 24px; width: 480px; max-width: 90vw; font-family: inherit; }
    dialog::backdrop { background: rgba(0,0,0,0.6); }
    dialog h2 { font-size: 14px; color: var(--accent); margin-bottom: 16px; letter-spacing: 1px; }
    dialog label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px;
      margin-top: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    dialog input, dialog textarea { width: 100%; background: #111; color: var(--text);
      border: 1px solid var(--border); padding: 8px 10px;
      font-family: inherit; font-size: 13px; border-radius: 3px; }
    dialog textarea { min-height: 80px; resize: vertical; }
    dialog input:focus, dialog textarea:focus { outline: none; border-color: var(--accent); }
    dialog select { width: 100%; background: #111; color: var(--text);
      border: 1px solid var(--border); padding: 8px 10px;
      font-family: inherit; font-size: 13px; border-radius: 3px; cursor: pointer; }
    dialog select:focus { outline: none; border-color: var(--accent); }
    #dialog-actions { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; }

    .empty-state { color: var(--muted); font-style: italic; padding: 8px 0; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #666; }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>CLOWDER</span>
      <button id="pause-btn" title="Pause auto-refresh" onclick="toggleRefresh()"
              style="font-size:10px;padding:2px 7px;letter-spacing:0">⏸ pause</button>
    </div>
    <div id="sidebar-scroll">
      <div class="section-header">▼ Templates (<span id="tpl-count">0</span>) <button style="font-size:10px;padding:1px 6px;float:right;margin-top:-1px" onclick="openNewTemplateDialog()">+</button></div>
      <div id="tpl-list"></div>
      <div class="section-header" style="margin-top:8px">▼ Schedules (<span id="schedules-count">0</span>) <button style="font-size:10px;padding:1px 6px;float:right;margin-top:-1px" onclick="openScheduleDialog()">+</button></div>
      <div id="schedules-list"></div>
      <div class="section-header" style="margin-top:8px">▼ Running (<span id="running-count">0</span>)</div>
      <div id="running-list"></div>
      <div class="section-header" style="margin-top:8px">▼ Recent (<span id="recent-count">0</span>)</div>
      <div id="recent-list"></div>
    </div>
  </div>

  <div id="right">
    <div id="detail-panel">
      <div id="detail-title">Clowder</div>
      <div id="detail-body"><span class="empty-state">Select an item from the sidebar.</span></div>
      <div id="detail-actions"></div>
    </div>
    <div id="log-panel">
      <div id="log-header">
        Log Output
        <span id="log-status"></span>
      </div>
      <div id="log-output"></div>
    </div>
  </div>
</div>

<dialog id="start-dialog">
  <h2>START PIPELINE</h2>
  <p style="color:var(--muted);font-size:12px" id="dialog-template-name"></p>
  <label>Prompt</label>
  <textarea id="dialog-prompt" rows="3" placeholder="Describe the task..."></textarea>
  <label>Workspace Path</label>
  <input id="dialog-workspace" type="text" value="D:/workspace">
  <div id="dialog-actions">
    <button onclick="closeStartDialog()">Cancel</button>
    <button class="primary" onclick="submitStartPipeline()">Start</button>
  </div>
</dialog>

<dialog id="build-dialog">
  <h2>BUILD PIPELINE</h2>
  <p style="color:var(--muted);font-size:12px" id="build-template-name"></p>
  <label>Prompt</label>
  <textarea id="build-prompt" rows="3" placeholder="Describe the task..."></textarea>
  <label>Workspace Path</label>
  <input id="build-workspace" type="text" value="D:/workspace">
  <div id="build-jobs-container" style="margin-top:16px"></div>
  <div id="build-dialog-actions" style="margin-top:20px;display:flex;gap:8px;justify-content:flex-end">
    <button onclick="closeBuildDialog()">Cancel</button>
    <button class="primary" onclick="submitBuildPipeline()">Run</button>
  </div>
</dialog>

<dialog id="retry-dialog">
  <h2>RETRY JOB</h2>
  <p style="color:var(--muted);font-size:12px" id="retry-job-name"></p>
  <label>Prompt <span style="color:var(--muted);font-weight:normal">(edit to change task before retrying)</span></label>
  <textarea id="retry-prompt" rows="8"></textarea>
  <div id="retry-dialog-actions" style="margin-top:20px;display:flex;gap:8px;justify-content:flex-end">
    <button onclick="closeRetryDialog()">Cancel</button>
    <button class="primary" onclick="submitRetry()">Retry</button>
  </div>
</dialog>

<dialog id="schedule-dialog">
  <h2>CREATE SCHEDULE</h2>
  <label>Name</label>
  <input id="sched-name" type="text" placeholder="Nightly build">
  <label>Template</label>
  <select id="sched-template"></select>
  <label>Cron Expression <span style="color:var(--muted);font-weight:normal">(5-field, e.g. "0 2 * * *")</span></label>
  <input id="sched-cron" type="text" placeholder="0 2 * * *">
  <label>Prompt</label>
  <textarea id="sched-prompt" rows="3" placeholder="Task description..."></textarea>
  <label>Workspace Path</label>
  <input id="sched-workspace" type="text" value="D:/workspace">
  <label style="display:flex;align-items:center;gap:6px;margin-top:12px">
    <input id="sched-enabled" type="checkbox" checked style="width:auto">
    <span>Enabled</span>
  </label>
  <div id="dialog-actions">
    <button onclick="closeScheduleDialog()">Cancel</button>
    <button class="primary" onclick="submitCreateSchedule()">Create</button>
  </div>
</dialog>

<dialog id="new-template-dialog">
  <h2>NEW TEMPLATE</h2>
  <label>Name</label>
  <input id="ntpl-name" type="text" placeholder="My Template">
  <label>Description</label>
  <input id="ntpl-description" type="text" placeholder="What this template does">
  <label>Category</label>
  <input id="ntpl-category" type="text" placeholder="development, testing, analysis…">
  <label>Template ID <span style="color:var(--muted);font-weight:normal">(leave blank to auto-generate)</span></label>
  <input id="ntpl-id" type="text" placeholder="my-template-id">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
    <button onclick="closeNewTemplateDialog()">Cancel</button>
    <button class="primary" onclick="submitNewTemplate()">Create</button>
  </div>
</dialog>

<dialog id="edit-template-dialog">
  <h2>EDIT TEMPLATE</h2>
  <input id="etpl-id" type="hidden">
  <label>Name</label>
  <input id="etpl-name" type="text">
  <label>Description</label>
  <input id="etpl-description" type="text">
  <label>Category</label>
  <input id="etpl-category" type="text" placeholder="development, testing, analysis…">
  <label>Default Vendor</label>
  <input id="etpl-vendor" type="text" placeholder="local-ollama, anthropic…">
  <label>Default Model</label>
  <input id="etpl-model" type="text" placeholder="qwen3:8b, claude-sonnet-4-6…">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
    <button onclick="closeEditTemplateDialog()">Cancel</button>
    <button class="primary" onclick="submitEditTemplate()">Save</button>
  </div>
</dialog>

<dialog id="edit-structure-dialog" style="width:740px;max-width:95vw;padding:0">
  <div style="padding:14px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0">
    <h2>EDIT STRUCTURE</h2>
    <p id="ess-title" style="color:var(--muted);font-size:12px;margin-top:4px"></p>
  </div>
  <div id="ess-body" style="max-height:65vh;overflow-y:auto;padding:14px 18px"></div>
  <div style="padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end">
    <button onclick="closeEssDialog()">Cancel</button>
    <button class="primary" onclick="submitEssStructure()">Save Structure</button>
  </div>
</dialog>

<script>
// ─── state ────────────────────────────────────────────────────────────────────
const state = {
  templates: [],        // array of dicts
  schedules: [],        // array of schedule objects
  running: [],          // array of pipeline objects
  recent: [],           // array of pipeline objects
  selected: null,       // { type: 'template'|'schedule'|'pipeline'|'stage'|'job', data }
  logJobId: null,
  logOffset: 0,
  logTimer: null,
  refreshTimer: null,
  followNextRunning: false,  // true while waiting for the next job to start running
};

// ─── API shape notes ──────────────────────────────────────────────────────────
// GET /pipelines/templates  → { template_id, name, description, category }[]
// GET /schedules            → { schedule_id, name, cron_expr, enabled, last_fired_at, next_fire_at, template_name }[]
// GET /pipelines/running    → { id, name, description, status, stages: [{ name, jobs: [{ id, name, status, prompt, log, retries }] }] }[]
// GET /pipelines/recent     → same shape
// GET /pipelines/jobs/{id}/log/since?line=N → { lines: string[], total: int, live: bool }
// GET /pipelines/jobs/{id}/log/full         → plain text

// ─── status helpers ───────────────────────────────────────────────────────────
function statusIcon(status) {
  switch (status) {
    case 'running':   return '[*]';
    case 'waiting':   return '[~]';
    case 'completed': return '[+]';
    case 'failed':    return '[X]';
    case 'pending':   return '[ ]';
    case 'retrying':  return '[R]';
    case 'skipped':   return '[-]';
    default:          return '[?]';
  }
}

function statusClass(status) {
  return 'status-' + (status || 'pending');
}

function shortId(id) {
  return id ? String(id).slice(0, 8) : '?';
}

function fmtTime(ts) {
  if (!ts) return '—';
  try { return new Date(ts).toLocaleTimeString(); } catch { return ts; }
}

function fmtLabel(ts) {
  // HH:MM if today, MM-DD HH:MM otherwise — matches TUI _format_timestamp.
  if (!ts) return '';
  try {
    const dt  = new Date(ts);
    const now = new Date();
    const hhmm = dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    if (dt.toDateString() === now.toDateString()) return hhmm;
    const mm = String(dt.getMonth() + 1).padStart(2, '0');
    const dd = String(dt.getDate()).padStart(2, '0');
    return `${mm}-${dd} ${hhmm}`;
  } catch { return ''; }
}

// ─── API helpers ──────────────────────────────────────────────────────────────
async function api(path, opts) {
  opts = opts || {};
  if (opts.body && !opts.headers) {
    opts.headers = { 'Content-Type': 'application/json' };
  }
  const res = await fetch(path, opts);
  if (res.status === 204) return null;
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function apiText(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.text();
}

// ─── helpers ──────────────────────────────────────────────────────────────────
function findNextRunningJob(excludeId = null) {
  for (const p of state.running) {
    for (const s of (p.stages || [])) {
      for (const j of (s.jobs || [])) {
        if (['running', 'retrying'].includes(j.status) && j.id !== excludeId) {
          return j;
        }
      }
    }
  }
  return null;
}

// ─── data fetching ────────────────────────────────────────────────────────────
async function fetchAll() {
  try {
    const [templates, schedules, running, recent] = await Promise.all([
      api('/pipelines/templates'),
      api('/schedules'),
      api('/pipelines/running'),
      api('/pipelines/recent?limit=10'),
    ]);
    state.templates = templates;  // list of dicts
    state.schedules = schedules;
    state.running   = running;
    state.recent    = recent;
    renderSidebar();

    // If a running pipeline is now completed, refresh its detail
    if (state.selected && state.selected.type === 'pipeline') {
      const pid = state.selected.data.id;
      const nowRecent    = recent.find(p => p.id === pid);
      const stillRunning = running.find(p => p.id === pid);
      if (nowRecent && !stillRunning) {
        selectItem('pipeline', nowRecent);
      }
    }

    // If a job is selected, check if its status changed and refresh the detail panel
    if (state.selected && state.selected.type === 'job') {
      const jobId = state.selected.data.id;
      let updatedJob = null;
      for (const p of [...running, ...recent]) {
        for (const s of (p.stages || [])) {
          const found = (s.jobs || []).find(j => j.id === jobId);
          if (found) { updatedJob = found; break; }
        }
        if (updatedJob) break;
      }
      if (updatedJob && updatedJob.status !== state.selected.data.status) {
        const prevStatus = state.selected.data.status;
        state.selected.data = { ...state.selected.data, status: updatedJob.status, retries: updatedJob.retries };
        renderDetail('job', state.selected.data);
        // If job just finished, stop polling and either auto-switch or fetch full log
        const wasRunning = ['running', 'retrying'].includes(prevStatus);
        const nowDone = !['running', 'retrying'].includes(updatedJob.status);
        if (nowDone && wasRunning && state.logJobId === jobId) {
          stopLogPolling();
          // Auto-switch to the next running job if one exists; otherwise enter
          // follow mode — the next job may still be pending and about to start.
          const nextJob = findNextRunningJob(jobId);
          if (nextJob) {
            selectItem('job', nextJob);
          } else {
            state.followNextRunning = true;
            fetchFullLog(jobId);
          }
        }
      }
    }

    // Follow mode: switch as soon as the next job starts running
    if (state.followNextRunning) {
      if (state.running.length === 0) {
        state.followNextRunning = false;  // pipeline finished entirely, stop following
      } else {
        const nextJob = findNextRunningJob();
        if (nextJob) selectItem('job', nextJob);
      }
    }
  } catch (e) {
    console.error('fetchAll error:', e);
  }
}

// ─── sidebar rendering ────────────────────────────────────────────────────────
function renderSidebar() {
  renderTemplates();
  renderSchedules();
  renderRunning();
  renderRecent();
}

function renderTemplates() {
  document.getElementById('tpl-count').textContent = state.templates.length;
  const el = document.getElementById('tpl-list');
  if (!state.templates.length) {
    el.innerHTML = '<div class="sb-template empty-state">No templates</div>';
    return;
  }
  // Group by category
  const groups = {};
  for (const t of state.templates) {
    const cat = t.category || '';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(t);
  }
  let html = '';
  const sortedCats = Object.keys(groups).sort((a, b) => {
    if (a === '') return 1;  // uncategorized last
    if (b === '') return -1;
    return a.localeCompare(b);
  });
  for (const cat of sortedCats) {
    if (cat) {
      html += `<div style="padding:4px 16px 2px 16px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px">${escHtml(cat)}</div>`;
    }
    for (const t of groups[cat]) {
      const active = isSelected('template', t.template_id) ? 'sb-active' : '';
      const data = { id: t.template_id, name: t.name };
      html += `<div class="sb-template ${active}" onclick="selectItem('template', ${safeJson(data)})">${escHtml(t.name || t.template_id)}</div>`;
    }
  }
  el.innerHTML = html;
}

function renderSchedules() {
  document.getElementById('schedules-count').textContent = state.schedules.length;
  const el = document.getElementById('schedules-list');
  if (!state.schedules.length) {
    el.innerHTML = '<div class="sb-template empty-state">No schedules</div>';
    return;
  }
  el.innerHTML = state.schedules.map(s => {
    const active = isSelected('schedule', s.schedule_id) ? 'sb-active' : '';
    const enabledDot = s.enabled ? '<span style="color:var(--ok)">●</span> ' : '<span style="color:var(--muted)">○</span> ';
    return `<div class="sb-template ${active}" onclick="selectItem('schedule', ${safeJson(s)})">${enabledDot}${escHtml(s.name)}</div>`;
  }).join('');
}

function renderRunning() {
  document.getElementById('running-count').textContent = state.running.length;
  const el = document.getElementById('running-list');
  if (!state.running.length) {
    el.innerHTML = '<div class="sb-pipeline empty-state">None running</div>';
    return;
  }
  el.innerHTML = state.running.map(p => pipelineHtml(p)).join('');
}

function renderRecent() {
  document.getElementById('recent-count').textContent = state.recent.length;
  const el = document.getElementById('recent-list');
  if (!state.recent.length) {
    el.innerHTML = '<div class="sb-pipeline empty-state">No recent runs</div>';
    return;
  }
  el.innerHTML = state.recent.map(p => pipelineHtml(p)).join('');
}

function pipelineHtml(p) {
  // Pipeline row (level 1)
  const pActive = isSelected('pipeline', p.id) ? 'sb-active' : '';
  // Pass pipeline without large log fields — only shape info needed for sidebar click
  const pData = { id: p.id, name: p.name, description: p.description,
                  status: p.status, created_at: p.created_at,
                  updated_at: p.updated_at, completed_at: p.completed_at };
  const ts = fmtLabel(p.completed_at);
  const tsPrefix = ts ? `<span style="color:var(--muted)">[${ts}]</span> ` : '';
  const label = escHtml(p.name || shortId(p.id));
  let html = `
    <div class="sb-pipeline ${pActive}" onclick="selectItem('pipeline', ${safeJson(pData)})">
      ${tsPrefix}<span class="${statusClass(p.status)}">${statusIcon(p.status)}</span> ${label}
    </div>`;

  // Stage rows (level 2)
  (p.stages || []).forEach(s => {
    const stageKey = p.id + ':' + s.name;
    const sActive = isSelected('stage', stageKey) ? 'sb-active' : '';
    // Aggregate stage status from jobs
    const jobStatuses = (s.jobs || []).map(j => j.status);
    const stageStatus = aggregateStatus(jobStatuses);
    const stageData = { name: s.name, pipeline_id: p.id,
                        jobs: (s.jobs || []).map(j => ({ id: j.id, name: j.name, status: j.status, retries: j.retries })) };
    html += `
      <div class="sb-stage ${sActive}" onclick="event.stopPropagation(); selectItem('stage', ${safeJson(stageData)})">
        <span class="${statusClass(stageStatus)}">${statusIcon(stageStatus)}</span>
        ${escHtml(s.name)}
      </div>`;

    // Job rows (recursive — supports unlimited depth via parent_job_id)
    html += renderJobsForStage(s.jobs || []);
  });

  return html;
}

function renderJobNode(job, allJobs, depth) {
  const indent = (depth * 16) + 'px';
  const children = allJobs.filter(j => j.parent_job_id === job.id);
  const jActive = isSelected('job', job.id) ? 'sb-active' : '';
  const jData = { id: job.id, name: job.name, status: job.status, retries: job.retries, prompt: job.prompt, iteration: job.iteration };
  const icon = statusIcon(job.status);
  const retryLabel = (job.retries || 0) > 0 ? ` (retry #${job.retries})` : '';
  let html = `
    <div class="sb-job ${jActive}" style="margin-left:${indent}"
         onclick="event.stopPropagation(); selectItem('job', ${safeJson(jData)})">
      <span class="${statusClass(job.status)}">${icon}</span>
      ${escHtml(job.name || shortId(job.id))}${escHtml(retryLabel)}
    </div>`;

  // Iteration rows (kept as sub-items under the job)
  if (job.iteration > 0) {
    for (let i = 1; i <= job.iteration; i++) {
      const iterKey = job.id + ':' + i;
      const iterActive = isSelected('iteration', iterKey) ? 'sb-active' : '';
      const iterData = { jobId: job.id, iteration: i };
      html += `
        <div class="sb-iteration ${iterActive}" style="margin-left:${indent}"
             onclick="event.stopPropagation(); selectItem('iteration', ${safeJson(iterData)})">
          ↳ Iteration ${i}
        </div>`;
    }
  }

  // Recursively render child jobs
  html += children.map(c => renderJobNode(c, allJobs, depth + 1)).join('');
  return html;
}

function _topoSortChain(chainJobs) {
  const ids = new Set(chainJobs.map(j => j.id));
  // Only consider deps within this chain
  const inChainDeps = new Map(chainJobs.map(j => [j.id, (j.depends_on || []).filter(d => ids.has(d))]));
  const result = [];
  const visited = new Set();
  // Start with roots (no in-chain deps)
  const queue = chainJobs.filter(j => inChainDeps.get(j.id).length === 0);
  while (queue.length > 0) {
    const job = queue.shift();
    if (visited.has(job.id)) continue;
    visited.add(job.id);
    result.push(job);
    for (const other of chainJobs) {
      if (visited.has(other.id)) continue;
      if (inChainDeps.get(other.id).every(d => visited.has(d))) queue.push(other);
    }
  }
  // Cycle protection: append any unvisited jobs
  for (const job of chainJobs) { if (!visited.has(job.id)) result.push(job); }
  return result;
}

function renderJobsForStage(stageJobs) {
  const stageJobIds = new Set(stageJobs.map(j => j.id));
  // Multiplier children (parent_job_id points to a job in this stage) are rendered by renderJobNode
  const topLevel = stageJobs.filter(j => !j.parent_job_id || !stageJobIds.has(j.parent_job_id));

  // Group top-level jobs by chain_id
  const chains = new Map();   // chain_id -> [job]
  const standalone = [];
  for (const job of topLevel) {
    if (job.chain_id) {
      if (!chains.has(job.chain_id)) chains.set(job.chain_id, []);
      chains.get(job.chain_id).push(job);
    } else {
      standalone.push(job);
    }
  }

  let html = '';
  for (const [chainId, chainJobs] of chains) {
    html += `<div class="sb-chain-header">◆ ${escHtml(chainId)}</div>`;
    for (const job of _topoSortChain(chainJobs)) {
      html += renderJobNode(job, stageJobs, 1);
    }
  }
  // Standalone jobs (no chain): render with dep-order at depth 0
  const standaloneRoots = standalone.filter(j => !(j.depends_on || []).some(d => standalone.some(s => s.id === d)));
  html += _topoSortChain(standalone).map(r => renderJobNode(r, stageJobs, 0)).join('');
  return html;
}

function aggregateStatus(statuses) {
  if (!statuses || !statuses.length) return 'pending';
  if (statuses.some(s => s === 'failed'))    return 'failed';
  if (statuses.some(s => s === 'retrying'))  return 'retrying';
  if (statuses.some(s => s === 'running'))   return 'running';
  if (statuses.every(s => s === 'completed'))return 'completed';
  if (statuses.every(s => s === 'skipped'))  return 'skipped';
  return 'pending';
}

function isSelected(type, id) {
  if (!state.selected) return false;
  if (state.selected.type !== type) return false;
  const d = state.selected.data;
  if (type === 'template') return d.id === id;
  if (type === 'schedule') return d.schedule_id === id;
  if (type === 'pipeline') return d.id === id;
  if (type === 'stage')    return (d.pipeline_id + ':' + d.name) === id;
  if (type === 'job')      return d.id === id;
  if (type === 'iteration') return (d.jobId + ':' + d.iteration) === id;
  return false;
}

// ─── selection ────────────────────────────────────────────────────────────────
function selectItem(type, data) {
  state.followNextRunning = false;
  state.selected = { type, data };
  stopLogPolling();
  clearLog();
  renderDetail(type, data);

  if (type === 'job') {
    const isLive = data.status === 'running' || data.status === 'retrying';
    if (isLive && data.id) {
      startLogPolling(data.id);
    } else if (data.id) {
      fetchFullLog(data.id);
    }
  } else if (type === 'iteration') {
    fetchIterationLog(data.jobId, data.iteration);
  } else {
    // Non-job: show a hint in the log panel
    document.getElementById('log-output').innerHTML =
      '<span style="color:var(--muted);font-style:italic">— select a job to view logs —</span>';
  }

  renderSidebar();  // update active state
}

// ─── detail panel ─────────────────────────────────────────────────────────────
function renderDetail(type, data) {
  const title  = document.getElementById('detail-title');
  const body   = document.getElementById('detail-body');
  const acts   = document.getElementById('detail-actions');

  if (type === 'schedule') {
    title.textContent = 'Schedule: ' + escHtml(data.name);
    const enabledLabel = data.enabled ? 'Yes' : 'No';
    const fields = [
      ['Name',      data.name],
      ['Template',  data.template_name || data.template_id],
      ['Cron',      data.cron_expr],
      ['Enabled',   enabledLabel],
      ['Last fired', data.last_fired_at ? fmtTime(data.last_fired_at) : '—'],
      ['Next fire',  data.next_fire_at  ? fmtTime(data.next_fire_at)  : '—'],
    ];
    body.innerHTML = rows(fields);
    const toggleBtn = data.enabled
      ? `<button onclick="disableSchedule('${data.schedule_id}')">Disable</button>`
      : `<button class="primary" onclick="enableSchedule('${data.schedule_id}')">Enable</button>`;
    acts.innerHTML =
      toggleBtn +
      `<button onclick="viewScheduleInstances('${data.schedule_id}')">View Instances</button>` +
      `<button class="danger" onclick="deleteSchedule('${data.schedule_id}')">Delete</button>`;

  } else if (type === 'template') {
    // data = { id, name?, description?, category? }
    title.textContent = data.name || data.id;
    body.innerHTML = rows([['Template ID', data.id, '', data.id]]) +
      '<span style="color:var(--muted);font-size:11px">loading details…</span>';
    acts.innerHTML =
      `<button class="primary" onclick="openStartDialog(${safeJson(data)})">Start Pipeline</button>` +
      `<button onclick="openBuildDialog(${safeJson(data)})">Build Pipeline</button>` +
      `<button onclick="openEssDialog(${safeJson(data)})">Edit Structure</button>` +
      `<button onclick="openEditTemplateDialog(${safeJson(data)})">Edit Metadata</button>` +
      `<button class="danger" onclick="deleteTemplate('${data.id}')">Delete</button>`;
    // Fetch full template details asynchronously
    api(`/pipelines/templates/${data.id}`).then(tpl => {
      if (!state.selected || state.selected.data.id !== data.id) return; // navigated away
      const fields = [['Template ID', tpl.id, '', tpl.id]];
      if (tpl.name) fields.push(['Name', tpl.name]);
      if (tpl.description) fields.push(['Description', tpl.description]);
      const listTpl = state.templates.find(t => t.template_id === tpl.id);
      const category = listTpl && listTpl.category;
      fields.push(['Category', category || '—']);
      const stageNames = (tpl.stages || []).map(s => s.name).join(' → ');
      if (stageNames) fields.push(['Stages', stageNames]);
      const jobCount = (tpl.stages || []).reduce((n, s) => n + (s.jobs || []).length, 0);
      if (jobCount) fields.push(['Jobs', String(jobCount)]);
      body.innerHTML = rows(fields);
    }).catch(() => {
      if (state.selected && state.selected.data.id === data.id)
        body.innerHTML = rows([['Template ID', data.id, '', data.id]]);
    });

  } else if (type === 'pipeline') {
    // data = { id, name, description, status, created_at, updated_at, completed_at }
    title.textContent = 'Pipeline: ' + shortId(data.id);
    const fields = [
      ['ID',     shortId(data.id), '', data.id],
      ['Name',   data.name],
      ['Status', data.status, statusClass(data.status)],
    ];
    if (data.description && data.description !== data.name) fields.push(['Desc', data.description]);
    if (data.created_at)   fields.push(['Created',   fmtTime(data.created_at)]);
    if (data.updated_at)   fields.push(['Updated',   fmtTime(data.updated_at)]);
    if (data.completed_at) fields.push(['Completed', fmtTime(data.completed_at)]);
    body.innerHTML = rows(fields);
    const stopBtn = data.status === 'running'
      ? `<button class="danger" onclick="stopPipeline('${data.id}')">Stop Pipeline</button>`
      : '';
    const deleteBtn = data.status !== 'running'
      ? `<button class="danger" onclick="deletePipeline('${data.id}')">Delete</button>`
      : '';
    acts.innerHTML = stopBtn + deleteBtn;

  } else if (type === 'stage') {
    // data = { name, pipeline_id, jobs: [{ id, name, status, retries }] }
    title.textContent = 'Stage: ' + data.name;
    const jobLines = (data.jobs || []).map(j =>
      `<div class="detail-row">
        <span class="${statusClass(j.status)}">${statusIcon(j.status)}</span>
        <span class="detail-value">&nbsp;${escHtml(j.name)} — <span class="${statusClass(j.status)}">${escHtml(j.status)}</span></span>
       </div>`
    ).join('');
    body.innerHTML = jobLines || '<span class="empty-state">No jobs in stage.</span>';
    acts.innerHTML = '';

  } else if (type === 'job') {
    // data = { id, name, status, retries, prompt }
    title.textContent = 'Job: ' + (data.name || shortId(data.id));
    const fields = [
      ['ID',      shortId(data.id), '', data.id],
      ['Status',  data.status, statusClass(data.status)],
      ['Retries', data.retries ?? 0],
    ];
    if (data.prompt) fields.push(['Prompt', data.prompt]);
    body.innerHTML = rows(fields);
    const canRetry = data.status === 'failed' || data.status === 'skipped';
    acts.innerHTML = canRetry
      ? `<button class="primary" onclick="openRetryDialog(${safeJson(data)})">Retry Job</button>`
      : '';
  } else if (type === 'iteration') {
    title.textContent = 'Iteration ' + data.iteration + ' of Job ' + shortId(data.jobId);
    body.innerHTML = rows([
      ['Job ID',    shortId(data.jobId), '', data.jobId],
      ['Iteration', data.iteration]
    ]);
    acts.innerHTML = '';
  }
}

function rows(fields) {
  return fields.map(([label, value, cls, copyValue]) => {
    const btn = copyValue
      ? `<button class="copy-btn" onclick="copyId(this,'${copyValue}')" title="Copy full ID">⎘</button>`
      : '';
    return `
    <div class="detail-row">
      <span class="detail-label">${escHtml(String(label))}</span>
      <span class="detail-value ${cls || ''}">${escHtml(String(value ?? '—'))}${btn}</span>
    </div>`;
  }).join('');
}

async function copyId(btn, fullId) {
  try {
    await navigator.clipboard.writeText(fullId);
  } catch {
    // Fallback for non-secure contexts
    const el = Object.assign(document.createElement('textarea'),
      { value: fullId, style: 'position:fixed;opacity:0' });
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  }
  btn.classList.add('copied');
  btn.textContent = '✓';
  setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '⎘'; }, 1500);
}

// ─── log polling ──────────────────────────────────────────────────────────────
function startLogPolling(jobId) {
  state.logJobId  = jobId;
  state.logOffset = 0;
  document.getElementById('log-status').textContent = '● live';
  document.getElementById('log-output').innerHTML =
    '<span style="color:var(--muted);font-style:italic">(waiting for output…)</span>';
  pollLog();  // immediate first fetch
  state.logTimer = setInterval(pollLog, 1000);
}

async function pollLog() {
  if (!state.logJobId) return;
  try {
    const data = await api(`/pipelines/jobs/${state.logJobId}/log/since?line=${state.logOffset}`);
    if (data.lines && data.lines.length > 0) {
      if (state.logOffset === 0) clearLog();  // remove "waiting…" placeholder
      appendLogLines(data.lines);
      state.logOffset = data.total;
    }
    if (!data.live && data.lines.length === 0) {
      stopLogPolling();
      if (state.logOffset === 0) {
        // Job ended with no output at all
        document.getElementById('log-output').innerHTML =
          '<span style="color:var(--muted)">(no log output)</span>';
      }
    }
  } catch (e) {
    console.error('pollLog error:', e);
  }
}

function stopLogPolling() {
  if (state.logTimer) { clearInterval(state.logTimer); state.logTimer = null; }
  state.logJobId = null;
  document.getElementById('log-status').textContent = '';
}

async function fetchFullLog(jobId) {
  try {
    document.getElementById('log-status').textContent = 'loading…';
    const text = await apiText(`/pipelines/jobs/${jobId}/log/full`);
    clearLog();
    if (text.trim()) {
      appendLogLines(text.split('\n'));
    } else {
      document.getElementById('log-output').innerHTML =
        '<span style="color:var(--muted)">(no log output)</span>';
    }
  } catch (e) {
    document.getElementById('log-output').textContent = 'Error loading log: ' + e.message;
  } finally {
    document.getElementById('log-status').textContent = '';
  }
}

async function fetchIterationLog(jobId, iteration) {
  try {
    document.getElementById('log-status').textContent = 'loading iteration log…';
    const text = await apiText(`/pipelines/jobs/${jobId}/iterations/${iteration}/log`);
    clearLog();
    if (text.trim()) {
      appendLogLines(text.split('\n'));
    } else {
      document.getElementById('log-output').innerHTML =
        '<span style="color:var(--muted)">(no log for this iteration yet)</span>';
    }
  } catch (e) {
    document.getElementById('log-output').textContent = 'Error loading iteration log: ' + e.message;
  } finally {
    document.getElementById('log-status').textContent = '';
  }
}

function clearLog() {
  document.getElementById('log-output').innerHTML = '';
  state.logOffset = 0;
}

function appendLogLines(lines) {
  const el = document.getElementById('log-output');
  const atBottom = el.scrollHeight - el.scrollTop <= el.clientHeight + 20;
  lines.forEach(line => {
    const span = document.createElement('span');
    span.className = 'log-line';
    span.textContent = line;
    el.appendChild(span);
  });
  if (atBottom) el.scrollTop = el.scrollHeight;
}

async function stopPipeline(pipelineId) {
  if (!confirm('Stop pipeline ' + shortId(pipelineId) + '?')) return;
  try {
    await api(`/pipelines/${pipelineId}/stop`, { method: 'POST' });
    await fetchAll();
  } catch (e) {
    alert('Stop failed: ' + e.message);
  }
}

async function deletePipeline(pipelineId) {
  if (!confirm('Permanently delete pipeline ' + shortId(pipelineId) + '?\n\nThis cannot be undone.')) return;
  try {
    await api(`/pipelines/${pipelineId}`, { method: 'DELETE' });
    state.selected = null;
    document.getElementById('detail-title').textContent = 'Clowder';
    document.getElementById('detail-body').innerHTML = '<span class="empty-state">Select an item from the sidebar.</span>';
    document.getElementById('detail-actions').innerHTML = '';
    await fetchAll();
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
}

let _retryOriginalPrompt = null;

function openRetryDialog(job) {

  document.getElementById('retry-prompt').value = _retryOriginalPrompt;

}

function closeRetryDialog() {
  document.getElementById('retry-dialog').close();
}

async function submitRetry() {
  const newPrompt = document.getElementById('retry-prompt').value;
  const promptChanged = newPrompt.trim() !== _retryOriginalPrompt.trim();
  try {
    await api(`/pipelines/jobs/${_retryJobId}/retry`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: promptChanged ? newPrompt : null }),
    });
    closeRetryDialog();
    await fetchAll();
  } catch (e) {
    alert('Retry failed: ' + e.message);
  }
}

function renderBuildJobs(stages) {
  const container = document.getElementById('build-jobs-container');
  if (!stages.length) {
    container.innerHTML = '<span class="empty-state">No stages in template.</span>';
    return;
  }
  container.innerHTML = stages.map((stage, si) => {
    // Separate chain-grouped jobs from standalone jobs
    const chains = {};   // chain_id -> [{job, ji}]
    const ungrouped = []; // [{job, ji}]
    (stage.jobs || []).forEach((job, ji) => {
      if (job.chain_id) {
        if (!chains[job.chain_id]) chains[job.chain_id] = [];
        chains[job.chain_id].push({job, ji});
      } else {
        ungrouped.push({job, ji});
      }
    });

    // Render one card per chain
    const chainCards = Object.entries(chains).map(([chainId, entries]) => {
      const p = `bc-${si}-${chainId}`;
      const refJob = (entries.find(e => e.job.agent_type === 'dev') || entries[0]).job;
      const vendor = refJob.vendor || 'local-ollama';
      const badges = entries.map(e =>
        `<span style="font-size:10px;padding:2px 6px;border-radius:3px;background:#1e2a1e;color:#7ec87e;margin-right:4px">${escHtml(e.job.agent_type)}</span>`
      ).join('');
      return `
        <div style="background:#111;border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:8px">
          <div style="color:var(--accent);font-size:11px;margin-bottom:6px;font-weight:600">chain: ${escHtml(chainId)}</div>

            ${vendorOptions(vendor)}
          </select>
          <label>Model</label>
          <select id="${p}-model">
            ${modelOptions(vendor, refJob.model || '')}
          </select>
          <label>Prompt Template</label>
          <textarea id="${p}-prompt" rows="3">${escHtml(refJob.prompt_template || '{{original_prompt}}')}</textarea>
          <label>Max Iterations</label>
          <input id="${p}-maxiter" type="number" value="${escHtml(String(refJob.max_iterations ?? 15))}">
        </div>`;
    });

    // Render standalone jobs as before (preserving original ji for submitBuildPipeline)
    const standaloneCards = ungrouped.map(({job, ji}) => {
      const p = `bj-${si}-${ji}`;
      const vendor = job.vendor || 'local-ollama';
      return `
        <div style="background:#111;border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:8px">
          <div style="color:var(--accent);font-size:11px;margin-bottom:8px">${escHtml(job.agent_type)}</div>
          <label>Vendor</label>
          <select id="${p}-vendor" onchange="onVendorChange(this, document.getElementById('${p}-model'))">
            ${vendorOptions(vendor)}
          </select>
          <label>Model</label>
          <select id="${p}-model">
            ${modelOptions(vendor, job.model || '')}
          </select>
          <label>Prompt Template</label>
          <textarea id="${p}-prompt" rows="3">${escHtml(job.prompt_template || '{{original_prompt}}')}</textarea>
          <label>Max Iterations</label>
          <input id="${p}-maxiter" type="number" value="${escHtml(String(job.max_iterations ?? 15))}">
        </div>`;
    });

    const cards = [...chainCards, ...standaloneCards].join('');
    return `
      <div style="margin-bottom:16px">
        <div style="color:var(--head);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">${escHtml(stage.name)}</div>
        ${cards}
      </div>`;
  }).join('');
}

async function submitBuildPipeline() {
  const prompt    = document.getElementById('build-prompt').value.trim();
  const workspace = document.getElementById('build-workspace').value.trim();
  if (!prompt) { document.getElementById('build-prompt').focus(); return; }

  const tpl = _buildTemplate;
  const stages = (tpl.stages || []).map((stage, si) => ({
    name: stage.name,
    stage_order: si,
    jobs: (stage.jobs || []).map((job, ji) => {
      // Chain jobs share one card; standalone jobs each have their own
      const p = job.chain_id ? `bc-${si}-${job.chain_id}` : `bj-${si}-${ji}`;
      const vendor = document.getElementById(`${p}-vendor`).value.trim() || job.vendor;
      const model  = document.getElementById(`${p}-model`).value.trim() || null;
      return {
        ref:              job.id,
        agent_type:       job.agent_type,
        name:             job.name || '',
        chain_id:         job.chain_id || null,
        vendor,
        model,
        prompt_template:  document.getElementById(`${p}-prompt`).value.trim() || job.prompt_template,
        max_iterations:   parseInt(document.getElementById(`${p}-maxiter`).value, 10) || job.max_iterations,
        timeout_seconds:  job.timeout_seconds,
        artifact_strategy: job.artifact_strategy ? JSON.parse(job.artifact_strategy) : null,
        retry_strategy:    job.retry_strategy    ? JSON.parse(job.retry_strategy)    : null,
        command_template: job.command_template || null,
      };
    }),
  }));

  // Derive dependencies from the template job dependency list
  // dep.depends_on is the prerequisite's template_job_id; job.id is the dependent's template_job_id
  const deps = [];
  (tpl.stages || []).forEach(stage => {
    (stage.jobs || []).forEach(job => {
      (job.dependencies || []).forEach(dep => {
        deps.push({ from_ref: dep.depends_on, to_ref: job.id, type: dep.type });
      });
    });
  });

  try {
    await api('/pipelines/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, workspace_path: workspace, stages, dependencies: deps }),
    });
    closeBuildDialog();
    await fetchAll();
  } catch (e) {
    alert('Build failed: ' + e.message);
  }
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function safeJson(obj) {
  return JSON.stringify(obj)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

let _ess = null;  // { templateId, stages: [...], deps: [...] }
function _essId() { return Math.random().toString(36).slice(2, 10); }

function openEssDialog(data) {
  _ess = { templateId: data.id, stages: [], deps: [] };
  document.getElementById('ess-title').textContent = data.name || data.id;

    '<span style="color:var(--muted);font-style:italic">Loading…</span>';
  document.getElementById('edit-structure-dialog').showModal();
  api(`/pipelines/templates/${data.id}`).then(tpl => {
    _ess.stages = (tpl.stages || []).map(s => ({
      _id: s.id || _essId(),
      stage_id: s.id,
      name: s.name,
      jobs: (s.jobs || []).map(j => ({
        _id: j.id,
        template_job_id: j.id,
        name: j.name || '',
        agent_type: j.agent_type || 'dev',
        vendor: j.vendor || 'local-ollama',
        model: j.model || '',
        prompt_template: j.prompt_template || '{{original_prompt}}',
        max_iterations: j.max_iterations || 50,
        timeout_seconds: j.timeout_seconds || 300,
      })),
    }));
    _ess.deps = [];
    (tpl.stages || []).forEach(s => {
      (s.jobs || []).forEach(j => {
        (j.dependencies || []).forEach(dep => {
          _ess.deps.push({ _id: _essId(), from_id: dep.depends_on, to_id: j.id, type: dep.type || 'success' });
        });
      });
    });
    renderEss();
  }).catch(e => {
    document.getElementById('ess-body').innerHTML =
      `<span style="color:var(--fail)">Error: ${escHtml(e.message)}</span>`;
  });
}

function closeEssDialog() {
  document.getElementById('edit-structure-dialog').close();
}

// Capture current DOM input values back into _ess state before any re-render
function captureEss() {
  if (!_ess) return;
  _ess.stages.forEach(stage => {
    const sn = document.getElementById(`ess-s-${stage._id}-name`);
    if (sn) stage.name = sn.value;
    stage.jobs.forEach(job => {
      const p = `ess-j-${job._id}`;
      [['type', 'agent_type'], ['name', 'name'], ['vendor', 'vendor'], ['model', 'model'], ['prompt', 'prompt_template'], ['cmd', 'command_template']].forEach(([sfx, fld]) => {
        const el = document.getElementById(`${p}-${sfx}`);
        if (el) job[fld] = el.value;
      });
      const mi = document.getElementById(`${p}-maxiter`);
      if (mi) job.max_iterations = parseInt(mi.value) || 50;
    });
  });
}

function essAddStage() {
  captureEss();
  _ess.stages.push({ _id: _essId(), stage_id: null, name: 'New Stage', jobs: [] });
  renderEss();
}
function essMoveStage(id, dir) {
  captureEss();
  const i = _ess.stages.findIndex(s => s._id === id);
  const j = i + dir;
  if (j < 0 || j >= _ess.stages.length) return;
  [_ess.stages[i], _ess.stages[j]] = [_ess.stages[j], _ess.stages[i]];
  renderEss();
}
function essRemoveStage(id) {
  captureEss();
  const s = _ess.stages.find(s => s._id === id);
  const gone = new Set(s ? s.jobs.map(j => j._id) : []);
  _ess.stages = _ess.stages.filter(s => s._id !== id);
  _ess.deps = _ess.deps.filter(d => !gone.has(d.from_id) && !gone.has(d.to_id));
  renderEss();
}
function essAddJob(stageId) {
  captureEss();
  const s = _ess.stages.find(s => s._id === stageId);
  if (!s) return;
  s.jobs.push({ _id: _essId(), template_job_id: null, name: '', agent_type: 'dev',
    vendor: 'local-ollama', model: '', prompt_template: '{{original_prompt}}',
    max_iterations: 50, timeout_seconds: 300 });
  renderEss();
}
function essMoveJob(stageId, jobId, dir) {
  captureEss();
  const s = _ess.stages.find(s => s._id === stageId);
  if (!s) return;
  const i = s.jobs.findIndex(j => j._id === jobId);
  const k = i + dir;
  if (k < 0 || k >= s.jobs.length) return;
  [s.jobs[i], s.jobs[k]] = [s.jobs[k], s.jobs[i]];
  renderEss();
}
function essRemoveJob(stageId, jobId) {
  captureEss();
  const s = _ess.stages.find(s => s._id === stageId);
  if (s) s.jobs = s.jobs.filter(j => j._id !== jobId);
  _ess.deps = _ess.deps.filter(d => d.from_id !== jobId && d.to_id !== jobId);
  renderEss();
}
function essAddDep() {
  captureEss();
  const from = document.getElementById('ess-dep-from').value;
  const to   = document.getElementById('ess-dep-to').value;
  const type = document.getElementById('ess-dep-type').value;
  if (!from || !to || from === to) return;
  _ess.deps.push({ _id: _essId(), from_id: from, to_id: to, type });
  renderEss();
}
function essRemoveDep(id) {
  captureEss();
  _ess.deps = _ess.deps.filter(d => d._id !== id);
  renderEss();
}

        <span>${escHtml(t ? t.label : dep.to_id.slice(0,6) + '…')}</span>
        <span style="color:var(--head)">(${escHtml(dep.type)})</span>
        <button onclick="essRemoveDep('${dep._id}')" style="padding:1px 5px;font-size:11px">×</button>
      </div>`;
    });
    html += '<div style="height:6px"></div>';
  }

  if (!allJobs.length) {
    html += `<span style="color:var(--muted);font-size:12px;font-style:italic">Add jobs first to define dependencies.</span>`;
  } else {
    html += `
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <select id="ess-dep-from" style="background:#111;color:var(--text);border:1px solid var(--border);padding:3px 6px;font-size:12px;border-radius:2px;font-family:inherit">
          <option value="">prereq (runs first)…</option>${jobOpts}
        </select>
        <span style="color:var(--muted)">→</span>
        <select id="ess-dep-to" style="background:#111;color:var(--text);border:1px solid var(--border);padding:3px 6px;font-size:12px;border-radius:2px;font-family:inherit">
          <option value="">dependent (runs after)…</option>${jobOpts}
        </select>
        <select id="ess-dep-type" style="background:#111;color:var(--text);border:1px solid var(--border);padding:3px 6px;font-size:12px;border-radius:2px;font-family:inherit">
          <option value="success">success</option>
          <option value="failure">failure</option>
          <option value="completed">completed</option>
          <option value="always">always</option>
        </select>
        <button onclick="essAddDep()" style="padding:3px 9px;font-size:12px">+ Add</button>
      </div>`;
  }
  html += `</div>`;
  body.innerHTML = html;
}

async function submitEssStructure() {
  captureEss();
  const stages = _ess.stages.map((stage, si) => ({
    template_stage_id: stage.stage_id || undefined,
    name: stage.name,
    stage_order: si,
    jobs: stage.jobs.map(job => ({
      ref: job._id,
      template_job_id: job.template_job_id || undefined,
      agent_type: job.agent_type,
      name: job.name || job.agent_type,
      prompt_template: job.prompt_template,
      command_template: job.command_template || null,
      vendor: job.vendor || undefined,
      model: job.model || undefined,
      max_iterations: job.max_iterations,
      timeout_seconds: job.timeout_seconds,
    })),
  }));
  // from_id = prerequisite (runs first), to_id = dependent (waits)
  // _insert_stages_jobs_deps expects from_ref = dependent, to_ref = prerequisite — swap here
  const dependencies = _ess.deps.map(d => ({ from_ref: d.to_id, to_ref: d.from_id, type: d.type }));
  const tid = _ess.templateId;
  try {
    await api(`/pipelines/templates/${tid}/structure`, {
      method: 'PATCH',
      body: JSON.stringify({ stages, dependencies }),
    });
    closeEssDialog();
    await fetchAll();
    const tpl = state.templates.find(t => t.template_id === tid);
    if (tpl) selectItem('template', { id: tpl.template_id, name: tpl.name });
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

document.getElementById('edit-structure-dialog').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeEssDialog();
});

// ─── refresh control ──────────────────────────────────────────────────────────
function toggleRefresh() {
  const btn = document.getElementById('pause-btn');
  if (state.refreshTimer) {
    clearInterval(state.refreshTimer);
    state.refreshTimer = null;
    btn.textContent = '▶ resume';
    btn.style.color = 'var(--run)';
    btn.style.borderColor = 'var(--run)';
    btn.title = 'Resume auto-refresh';
  } else {
    state.refreshTimer = setInterval(fetchAll, 2000);
    btn.textContent = '⏸ pause';
    btn.style.color = '';
    btn.style.borderColor = '';
    btn.title = 'Pause auto-refresh';
  }
}

// ─── init ─────────────────────────────────────────────────────────────────────
async function init() {
  await fetchAll();
  state.refreshTimer = setInterval(fetchAll, 2000);
}

init();
</script>
